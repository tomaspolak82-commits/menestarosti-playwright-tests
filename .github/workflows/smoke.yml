name: Smoke tests

on:
  schedule:
    # Every morning at 04:00 UTC (06:00 summer time, 05:00 winter time in Prague).
    # GitHub may start scheduled runs with a delay.
    - cron: '0 4 * * *'
  workflow_dispatch:

# Never run two smoke runs against the live site at the same time.
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://menestarosti.cz
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run smoke tests
        run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
